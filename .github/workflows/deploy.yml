name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      self_destroy_sw:
        description: 救援：部署自我解除版 sw.js（把手機上壞掉的 service worker 換掉；平常不要勾）
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # vitest 在 Linux 的執行結果同時是 runner flaky 的第二觀察點（見 session-state/active.md 未解失敗）
      - run: npx vitest run
      - run: npm run build
        env:
          # 手動觸發且勾了 self_destroy_sw 才為 1；push 觸發時 inputs 為空，這裡是空字串
          SW_SELF_DESTROY: ${{ inputs.self_destroy_sw && '1' || '' }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # e2e 用的容器 tag 要跟 @playwright/test 同版（容器內建的瀏覽器版本綁死 Playwright 版本），從 lockfile 讀，升版不用手改
  pw:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  # 全量 e2e 分 8 份同時跑、每份 1 個 worker（本機只開得起 2 個 WebKit，全量要 14 分鐘）；沒全綠就不部署。
  # 救援部署（self_destroy_sw）跳過：那時手機上的 SW 已經壞了，不能讓偶發紅擋住救援。
  # 跑在 Playwright 官方容器裡（WebKit 與系統依賴已裝好）：2026-11-11 兩輪紅在 apt 解析不到 *.ubuntu.com，一條測試都沒跑；
  # 容器從 mcr.microsoft.com 拉，不碰 ubuntu 鏡像。中文字型照舊用 fonts-noto-cjk（折行與高度類斷言靠它貼近手機），
  # .deb 放 actions/cache，只有快取沒命中（第一次或 key 改了）才走 apt。
  e2e:
    if: ${{ !inputs.self_destroy_sw }}
    needs: pw
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.pw.outputs.version }}-noble
    timeout-minutes: 25
    # 跑 npm ci（會執行套件的安裝腳本），不給它頂層的 pages／id-token
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/cjk-font
      # GitHub runner 本來就設 CI=true，playwright.config 靠它開重試
      - run: npx playwright test --shard=${{ matrix.shard }}/8
      # 失敗時把截圖與 trace 留下來（config 是 retain-on-failure），本機沒有 Linux 可重現
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # burn-in：這次 push 改到的 e2e 測試各跑 5 次、不重試（選法見 scripts/e2e-burnin.mjs）。
  # 本機快、CI 慢，量得太早的新測試本機驗不出來；讓它第一次 push 就紅，不要之後隨機冒出來。
  burn-in:
    if: ${{ !inputs.self_destroy_sw && github.event_name == 'push' }}
    needs: pw
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.pw.outputs.version }}-noble
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # 容器裡 checkout 的目錄擁有者跟執行者不同，git 會拒絕操作
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/cjk-font
      # before 全零＝新分支第一次 push，沒有可比的基準
      - env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then echo '沒有前一版可比，跳過'; exit 0; fi
          # force-push 後 before 那個 commit 不在任何分支上，clone 裡沒有；不跳過的話重跑也一樣紅、只能再推一次
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || { echo '::warning::前一版不在 clone 裡（force-push？），跳過 burn-in'; exit 0; }
          node scripts/e2e-burnin.mjs "$BEFORE"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-burn-in-failures
          path: test-results/
          retention-days: 7

  deploy:
    needs: [build, pw, e2e, burn-in]
    # 「跳過」只在救援時算過關：e2e／burn-in 都 needs pw，pw 一紅它們會被跳過，不擋的話等於一條測試都沒跑就部署。
    # burn-in 在手動觸發時本來就跳過（只對 push），所以非救援時要另外看 pw 有沒有成功
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && (
        inputs.self_destroy_sw ||
        (needs.pw.result == 'success' && needs.e2e.result == 'success' && (needs.burn-in.result == 'success' || needs.burn-in.result == 'skipped'))
      ) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
