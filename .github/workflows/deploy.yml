name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      self_destroy_sw:
        description: 救援：部署自我解除版 sw.js（把手機上壞掉的 service worker 換掉；平常不要勾）
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # vitest 在 Linux 的執行結果同時是 runner flaky 的第二觀察點（見 session-state/active.md 未解失敗）
      - run: npx vitest run
      - run: npm run build
        env:
          # 手動觸發且勾了 self_destroy_sw 才為 1；push 觸發時 inputs 為空，這裡是空字串
          SW_SELF_DESTROY: ${{ inputs.self_destroy_sw && '1' || '' }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # 全量 e2e 分 8 份同時跑、每份 1 個 worker（本機只開得起 2 個 WebKit，全量要 14 分鐘）；沒全綠就不部署。
  # 救援部署（self_destroy_sw）跳過：那時手機上的 SW 已經壞了，不能讓偶發紅擋住救援。
  e2e:
    if: ${{ !inputs.self_destroy_sw }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 跑 npm ci 與 playwright install（會執行套件的安裝腳本），不給它頂層的 pages／id-token
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Linux runner 沒有中文字型，折行與高度類斷言會跟手機差很遠
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npx playwright install --with-deps webkit
      # GitHub runner 本來就設 CI=true，playwright.config 靠它開重試
      - run: npx playwright test --shard=${{ matrix.shard }}/8
      # 失敗時把截圖與 trace 留下來（config 是 retain-on-failure），本機沒有 Linux 可重現
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  deploy:
    needs: [build, e2e]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
