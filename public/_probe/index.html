<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally 離線探針（已退場）</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top)); color: #222; }
</style>
</head>
<body>
<h1>探針已退場</h1>
<p id="status">正在清除探針的資料…</p>
<script>
/* 不再註冊 SW。只動探針自己的：getRegistrations 與 CacheStorage 都是整個源站共用，
   正式站的 SW（scope /tally/）也在裡面，一定要先比對 scope，快取也只刪 probe-v1。 */
async function retire() {
  let removed = 0
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations()
    for (const r of regs) {
      if (new URL(r.scope).pathname.endsWith('/_probe/')) {
        await r.unregister()
        removed += 1
      }
    }
  }
  if (self.caches) await caches.delete('probe-v1')
  return removed
}
retire()
  .then(() => { document.getElementById('status').textContent = '清除完成，可以關閉這一頁。' })
  .catch((e) => { document.getElementById('status').textContent = '清除失敗：' + e.message })
</script>
</body>
</html>
