<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Tally</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ══════ 登入 ══════ -->
<div class="screen" id="view-login" hidden>
  <main class="login">
    <h1>Tally</h1>
    <p>記錄今天吃了什麼</p>
    <button class="cta" id="btn-signin">用 Google 登入</button>
    <p class="err" id="signin-error" role="alert" hidden></p>
  </main>
</div>

<!-- ══════ App ══════ -->
<div class="screen" id="view-app" hidden>

  <header class="topbar">
    <h1 class="today" id="page-title">今天</h1>
    <!-- 日期本身是原生 input[type=date]（點了叫系統日曆）；左右箭頭各走一天，
         右箭頭在今天停用——看不了未來 -->
    <div class="datectl" id="page-date">
      <button class="date-arrow" id="date-prev" type="button" aria-label="前一天">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <input class="date-input" id="date-input" type="date" aria-label="檢視日期">
      <button class="date-arrow" id="date-next" type="button" aria-label="後一天">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </header>

  <main class="main">

    <!-- ── 日記 ── -->
    <div class="main" id="pane-today">

      <section class="gauge" aria-label="今日熱量">
        <div class="gauge-top">
          <div>
            <div class="gauge-lead" id="gauge-lead">還能吃</div>
            <div aria-live="polite"><span class="gauge-num" id="gauge-num">—</span><span class="gauge-unit">卡</span></div>
          </div>
          <div class="gauge-side pair" id="gauge-side">
            <span aria-hidden="true"><span class="cur">—</span><span class="sep">/</span><span class="tgt">—</span></span>
          </div>
        </div>
        <div class="bar" aria-hidden="true"><div class="fill" id="gauge-fill" style="width:0%"></div></div>
      </section>

      <section class="macros" aria-label="三大營養素" id="macros">
        <div class="macro" data-macro="protein">
          <div class="lbl">蛋白質</div>
          <div class="track-box" aria-hidden="true"><div class="track"><div class="fill" style="width:0%"></div></div></div>
          <div class="val pair"><span aria-hidden="true"><span class="cur">—</span><span class="sep">/</span><span class="tgt">—</span></span></div>
        </div>
        <div class="macro" data-macro="fat">
          <div class="lbl">脂肪</div>
          <div class="track-box" aria-hidden="true"><div class="track"><div class="fill" style="width:0%"></div></div></div>
          <div class="val pair"><span aria-hidden="true"><span class="cur">—</span><span class="sep">/</span><span class="tgt">—</span></span></div>
        </div>
        <div class="macro" data-macro="carb">
          <div class="lbl">碳水</div>
          <div class="track-box" aria-hidden="true"><div class="track"><div class="fill" style="width:0%"></div></div></div>
          <div class="val pair"><span aria-hidden="true"><span class="cur">—</span><span class="sep">/</span><span class="tgt">—</span></span></div>
        </div>
      </section>

      <div class="timeline" id="timeline"></div>

      <div class="cta-wrap">
        <button class="cta" id="btn-add" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>記一筆</button>
      </div>
    </div>

    <!-- ── 設定 ── -->
    <div class="settings" id="pane-settings" hidden></div>

    <!-- ── 載入／錯誤／降級 ── -->
    <div class="notice" id="pane-notice" hidden></div>

  </main>

  <nav class="tabbar-wrap" aria-label="主要導覽"><div class="tabbar">
    <button class="tab" data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 4v16"/></svg>日記</button>
    <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"/></svg>設定</button>
  </div></nav>

  <!-- 記一筆／新增食物／記體重共用的覆蓋層。內容由 app.js 渲染 -->
  <div id="sheet-root"></div>

</div>

<script src="app.js"></script>
</body>
</html>
