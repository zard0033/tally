<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Tally — 淺色配色選項</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: oklch(89% 0.002 0); }
body { font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; padding: 32px; color: oklch(25% .005 0); }
.head { max-width: 1200px; margin: 0 auto 30px; }
.head h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
.head p { font-size: .9rem; color: oklch(44% .005 0); max-width: 84ch; line-height: 1.65; }
.row { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; max-width: 1740px; margin: 0 auto; align-items: flex-start; }
.col { width: 390px; }
.col h2 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
.col .why { font-size: .82rem; color: oklch(42% .005 0); line-height: 1.55; margin-bottom: 4px; }
.col .cost { font-size: .8rem; color: oklch(48% .06 30); line-height: 1.5; margin-bottom: 12px; }
.frame { width: 390px; height: 800px; border-radius: 30px; overflow: hidden; border: 1px solid oklch(78% .005 0); }
.chips { margin-top: 14px; font-size: .73rem; line-height: 1.95; color: oklch(40% .005 0); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; border: 1px solid oklch(0% 0 0/.14); }
.overdemo { margin-top: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid oklch(84% .004 0); }
.overdemo .cap { font-size: .72rem; color: oklch(46% .005 0); margin-bottom: 7px; }
.overdemo .obar { height: 8px; border-radius: 4px; }
.overdemo .oval { font-size: .74rem; margin-top: 6px; font-family: ui-monospace, Menlo, monospace; }

/* ══ 骨架（吃 theme token） ══ */
.screen {
  --t-xs:.72rem; --t-sm:.8rem; --t-base:.875rem; --t-md:1rem; --t-hero:2.75rem;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  background: var(--paper); color: var(--ink);
  height: 100%; display: flex; flex-direction: column; font-size: var(--t-base);
}
.screen svg { stroke: currentColor; fill: none; stroke-width: 1.6; }
.topbar { display:flex; align-items:center; justify-content:space-between; padding: var(--s-4) var(--s-5) var(--s-2); font-weight:700; font-size:var(--t-md); }
.topbar .arrow { width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:var(--muted); }
.topbar .arrow svg { width:16px; height:16px; }
.gauge { padding: var(--s-1) var(--s-5) var(--s-4); }
.gauge-top { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:var(--s-3); }
.gauge-lead { font-size:var(--t-sm); color:var(--muted); margin-bottom:2px; }
.gauge-num { font-family:var(--mono); font-size:var(--t-hero); font-weight:600; letter-spacing:-.025em; line-height:.95; }
.gauge-unit { font-size:var(--t-sm); color:var(--muted); margin-left:var(--s-1); }
.gauge-side { font-family:var(--mono); font-size:var(--t-xs); color:var(--muted); text-align:right; line-height:1.7; }
.bar { height:8px; border-radius:4px; background:var(--rule); overflow:hidden; }
.bar .fill { height:100%; border-radius:4px; background:var(--accent); }
.macros { display:flex; gap:var(--s-4); padding:0 var(--s-5) var(--s-4); }
.macro { flex:1; min-width:0; }
.macro .lbl { font-size:var(--t-xs); color:var(--muted); margin-bottom:var(--s-1); white-space:nowrap; }
.macro .track { height:3px; border-radius:2px; background:var(--rule); }
.macro .fill { height:100%; border-radius:2px; background:var(--accent); }
.macro .val { font-family:var(--mono); font-size:var(--t-xs); color:var(--muted); margin-top:var(--s-1); }
.rule-line { height:1px; background:var(--rule); margin:0 var(--s-5); }
.timeline { flex:1; overflow-y:auto; padding:var(--s-4) var(--s-5) var(--s-2); }
.node { display:grid; grid-template-columns:18px 1fr; gap:var(--s-3); }
.rail { display:flex; flex-direction:column; align-items:center; }
.dot { width:9px; height:9px; border-radius:50%; background:var(--accent); margin-top:6px; flex-shrink:0; }
.dot.todo { background:transparent; border:1.5px solid var(--rule); }
.line { width:1px; flex:1; background:var(--rule); margin:var(--s-1) 0; }
.line.todo { background:repeating-linear-gradient(to bottom, var(--rule) 0 3px, transparent 3px 7px); }
.node-body { min-width:0; padding-bottom:var(--s-5); }
.node-head { display:flex; align-items:baseline; justify-content:space-between; gap:var(--s-2); padding-bottom:var(--s-2); border-bottom:1px solid var(--rule); }
.node-name { font-weight:700; font-size:var(--t-md); }
.node-kcal { font-family:var(--mono); font-size:var(--t-base); font-weight:600; }
.items { margin-top:var(--s-2); }
.item { display:flex; justify-content:space-between; gap:var(--s-3); font-size:var(--t-base); padding:3px 0; }
.item .nm { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item .kc { font-family:var(--mono); font-size:var(--t-sm); color:var(--muted); flex-shrink:0; }
.pool { display:grid; grid-template-columns:18px 1fr; gap:var(--s-3); }
.pool .rail .line { background:repeating-linear-gradient(to bottom, var(--rule) 0 3px, transparent 3px 7px); margin:0; }
.pool-text { font-size:var(--t-sm); color:var(--muted); padding-bottom:var(--s-4); line-height:1.5; }
.pool-text b { font-family:var(--mono); font-size:var(--t-md); color:var(--accent); font-weight:600; }
.todo-row { display:flex; align-items:center; justify-content:space-between; min-height:44px; width:100%; background:none; border:none;
  cursor:pointer; text-align:left; font-family:inherit; color:inherit; padding:0; transition:opacity 160ms cubic-bezier(.4,0,.2,1); }
.todo-row:hover { opacity:.68; }
.todo-row:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:8px; }
.todo-row .lb { font-weight:700; font-size:var(--t-md); }
.todo-row .chev { width:14px; height:14px; color:var(--rule); }
.cta-wrap { padding:var(--s-2) var(--s-5); }
.cta { display:flex; align-items:center; justify-content:center; gap:var(--s-2); width:100%; min-height:52px; border:none; border-radius:16px;
  cursor:pointer; background:var(--accent); color:var(--on-accent); font-family:inherit; font-size:var(--t-md); font-weight:700; }
.cta svg { width:18px; height:18px; stroke-width:2.4; }
.tabbar-wrap { padding:var(--s-2) var(--s-5) var(--s-5); }
.tabbar { display:flex; gap:var(--s-1); padding:var(--s-1); background:var(--card); border:1px solid var(--rule); border-radius:16px; }
.tab { flex:1; display:flex; align-items:center; justify-content:center; gap:var(--s-2); min-height:44px; border-radius:12px;
  font-size:var(--t-sm); font-weight:600; color:var(--muted); white-space:nowrap; }
.tab.active { background:var(--paper); color:var(--accent); }
.tab svg { width:16px; height:16px; }
</style>
</head>
<body>

<div class="head">
  <h1>Tally — 淺色配色，四選一</h1>
  <p>骨架與階層已定（時間軸＋共用額度＋餐別標題細線），四個方向只換色票。每個下方附「破表時長這樣」的對照條——accent 和警告紅能不能分得開，是這輪最關鍵的判準。資料為你 07-24 的真實紀錄。</p>
</div>

<div class="row" id="row"></div>

<script>
const THEMES = [
  {
    key: 'terracotta', name: 'A｜陶土',
    why: '暖米紙配磚紅，最有食物與手作感，也最接近先前樣張的溫度。',
    cost: '弱點：accent 磚紅（hue 40）和警告紅（hue 25）色相太近，破表時要靠斜紋才分得出來。',
    t: { paper:'oklch(97% .008 60)', card:'oklch(99% .005 60)', rule:'oklch(88% .008 55)',
         ink:'oklch(20% .010 45)', muted:'oklch(47% .009 48)', accent:'oklch(50% .15 40)',
         onAccent:'oklch(98% .008 60)', over:'oklch(48% .19 25)', stripe:'oklch(62% .17 25)' }
  },
  {
    key: 'moss', name: 'C｜青苔（我自己調的綠）',
    why: '米底不變，accent 換深橄欖綠。和警告紅的色相距離最遠，破表一眼就跳出來；綠色也貼「吃得好」的語義。',
    cost: '弱點：色票是我為這一頁現推的，沒有在真實產品上被驗證過。',
    t: { paper:'oklch(97% .008 85)', card:'oklch(99% .005 85)', rule:'oklch(88% .010 90)',
         ink:'oklch(21% .012 120)', muted:'oklch(47% .010 110)', accent:'oklch(45% .10 145)',
         onAccent:'oklch(98% .008 120)', over:'oklch(48% .19 25)', stripe:'oklch(62% .17 25)' }
  },
  {
    key: 'gambit', name: 'E｜奶油＋青瓷（沿用 Gambit）',
    why: '直接取自 Gambit 的 design system（colors_and_type.css）。結構跟 C 一樣是暖米底＋綠，但色票在真實產品上跑過、對比度都標註驗證過：ink 對 cream 10:1、jade 5.55:1、danger-dark 6.06:1。兩個專案共用色系，你自己的東西會有家族感。',
    cost: '弱點：Gambit 之後若改色票，兩邊要同步。只取用得到的子集（棋盤、地圖磚、金色高光都不搬）。',
    t: { paper:'#FAF6F0', card:'#FCF9F3', rule:'#E0D3BD',
         ink:'#3D2210', muted:'#7A5C44', accent:'#1C7059',
         onAccent:'#FFFFFF', over:'#9A4330', stripe:'#C06A50' }
  },
];

const ICON = {
  prev: '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  book: '<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 4v16"/></svg>',
  gear: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"/></svg>',
};

function meal(name, kcal, items, last) {
  return `<div class="node">
    <div class="rail"><div class="dot"></div><div class="line"></div></div>
    <div class="node-body">
      <div class="node-head"><span class="node-name">${name}</span><span class="node-kcal">${kcal}</span></div>
      <div class="items">${items.map(i => `<div class="item"><span class="nm">${i[0]}</span><span class="kc">${i[1]}</span></div>`).join('')}</div>
    </div></div>`;
}
function todo(name, last) {
  return `<div class="node">
    <div class="rail"><div class="dot todo"></div>${last ? '' : '<div class="line todo"></div>'}</div>
    <div class="node-body" style="padding-bottom:${last ? '0' : '8px'}">
      <button class="todo-row"><span class="lb">${name}</span><span class="chev">${ICON.next}</span></button>
    </div></div>`;
}

document.getElementById('row').innerHTML = THEMES.map(th => {
  const vars = `--paper:${th.t.paper};--card:${th.t.card};--rule:${th.t.rule};--ink:${th.t.ink};`
             + `--muted:${th.t.muted};--accent:${th.t.accent};--on-accent:${th.t.onAccent};`;
  return `<div class="col">
    <h2>${th.name}</h2>
    <div class="why">${th.why}</div>
    <div class="cost">${th.cost}</div>
    <div class="frame">
      <div class="screen" style="${vars}">
        <div class="topbar"><div class="arrow">${ICON.prev}</div><div>今天</div><div class="arrow">${ICON.next}</div></div>
        <div class="gauge">
          <div class="gauge-top">
            <div><div class="gauge-lead">還能吃</div><div><span class="gauge-num">957</span><span class="gauge-unit">kcal</span></div></div>
            <div class="gauge-side">已吃 903<br>目標 1860</div>
          </div>
          <div class="bar"><div class="fill" style="width:48.5%"></div></div>
        </div>
        <div class="macros">
          <div class="macro"><div class="lbl">蛋白質</div><div class="track"><div class="fill" style="width:48%"></div></div><div class="val">60.5/126</div></div>
          <div class="macro"><div class="lbl">脂肪</div><div class="track"><div class="fill" style="width:73%"></div></div><div class="val">40.9/56</div></div>
          <div class="macro"><div class="lbl">碳水</div><div class="track"><div class="fill" style="width:34%"></div></div><div class="val">73.0/214</div></div>
        </div>
        <div class="rule-line"></div>
        <div class="timeline">
          ${meal('早餐', 293, [['乳清（1匙）',103],['燕麥片（5匙）',120],['茶葉蛋',70]])}
          ${meal('午餐', 610, [['培根起司軟法',610]])}
          <div class="pool"><div class="rail"><div class="line"></div></div>
            <div class="pool-text">接下來這兩餐<br>還有 <b>957</b> kcal 可以分</div></div>
          ${todo('晚餐', false)}
          ${todo('點心', true)}
        </div>
        <div class="cta-wrap"><button class="cta">${ICON.plus}記一筆</button></div>
        <div class="tabbar-wrap"><div class="tabbar">
          <div class="tab active">${ICON.book}日記</div><div class="tab">${ICON.gear}設定</div>
        </div></div>
      </div>
    </div>
    <div class="chips">
      <div><span class="sw" style="background:${th.t.paper}"></span>paper ${th.t.paper}</div>
      <div><span class="sw" style="background:${th.t.ink}"></span>ink ${th.t.ink}</div>
      <div><span class="sw" style="background:${th.t.accent}"></span>accent ${th.t.accent}</div>
      <div><span class="sw" style="background:${th.t.over}"></span>over ${th.t.over}</div>
    </div>
    <div class="overdemo" style="background:${th.t.paper}">
      <div class="cap" style="color:${th.t.muted}">破表時（07-25 實際：超出 229）</div>
      <div class="obar" style="background:repeating-linear-gradient(-45deg, ${th.t.over} 0 4px, ${th.t.stripe} 4px 8px)"></div>
      <div class="oval" style="color:${th.t.over}">超出 229 · 脂肪 89.1/56</div>
    </div>
  </div>`;
}).join('');
</script>
</body>
</html>
